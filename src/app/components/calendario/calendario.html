<div class="cal-page">

    <!-- ===== LATERAL: CALENDÁRIO PEQUENO ===== -->

    <aside class="cal-lateral">

        <div class="cal-titulo">Calendário</div>

        <div class="mini-topo">

            <span>{{ nomeMesMini }} {{ anoMesMini }}</span>

            <div>
                <button type="button" (click)="moverMiniMes(-1)" title="Mês anterior">
                    <i class="bi bi-chevron-up"></i>
                </button>
                <button type="button" (click)="moverMiniMes(1)" title="Próximo mês">
                    <i class="bi bi-chevron-down"></i>
                </button>
            </div>

        </div>

        <div class="mini-grade">

            <span class="mini-letra" *ngFor="let letra of letrasSemana">{{ letra }}</span>

            <button
                type="button"
                class="mini-dia"
                *ngFor="let d of diasMini"
                [class.fora]="d.getMonth() !== mesMini.getMonth()"
                [class.hoje]="ehHoje(d)"
                [class.selecionado]="ehSelecionado(d)"
                [class.feriado]="mostrarFeriados && temFeriado(d)"
                (click)="selecionarDia(d)"
            >
                {{ d.getDate() }}
            </button>

        </div>

    </aside>


    <!-- ===== PRINCIPAL ===== -->

    <main class="cal-principal">

        <!-- BARRA SUPERIOR -->

        <header class="cal-barra">

            <div class="barra-esquerda">

                <button type="button" class="botao-hoje" (click)="hoje()">Hoje</button>

                <button type="button" class="icone" (click)="mover(-1)" title="Anterior">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <button type="button" class="icone" (click)="mover(1)" title="Próximo">
                    <i class="bi bi-chevron-right"></i>
                </button>

                <span class="periodo">{{ textoPeriodo }}</span>

            </div>

            <div class="barra-direita">

                <button
                    type="button"
                    class="botao-feriados"
                    [class.ativo]="mostrarFeriados"
                    (click)="alternarFeriados()"
                    title="Mostrar feriados nacionais"
                >
                    <i class="bi bi-calendar-event"></i>
                    Feriados
                </button>

                <select class="seletor-visao" [(ngModel)]="visao">
                    <option value="dia">Dia</option>
                    <option value="semana">Semana</option>
                    <option value="mes">Mês</option>
                </select>

                <button
                    type="button"
                    class="botao-novo"
                    (click)="novoEventoEm(dataSelecionada, proximaHora())"
                >
                    <i class="bi bi-plus-lg"></i>
                    Novo
                </button>

            </div>

        </header>


        <!-- VISÃO DE DIA / SEMANA -->

        <section class="grade-tempo" *ngIf="visao !== 'mes'">

            <div class="cabecalho-dias" [style.--colunas]="diasVisiveis.length">

                <div class="canto"></div>

                <div
                    class="cabecalho-dia"
                    *ngFor="let d of diasVisiveis"
                    [class.hoje]="ehHoje(d)"
                >
                    <span class="numero-dia">{{ d.getDate() }}</span>
                    <span class="nome-dia">{{ nomeDia(d) }}</span>
                    <span class="feriado-nome" *ngIf="feriadoDoDia(d) as feriado">{{ feriado }}</span>
                </div>

            </div>

            <div class="corpo-tempo" [style.--colunas]="diasVisiveis.length">

                <div class="coluna-horas">
                    <div class="rotulo-hora" *ngFor="let h of horas">{{ h }}</div>
                </div>

                <div class="coluna-dia" *ngFor="let d of diasVisiveis">

                    <div
                        class="slot"
                        *ngFor="let h of horas"
                        (click)="novoEventoEm(d, h)"
                    ></div>

                    <button
                        type="button"
                        class="evento"
                        *ngFor="let e of eventosDoDia(d)"
                        [ngStyle]="estiloEvento(e)"
                        (click)="editarEvento(e, $event)"
                    >
                        <strong>{{ e.titulo }}</strong>
                        <span>{{ hora(e.inicio) }} – {{ hora(e.fim) }}</span>
                    </button>

                </div>

            </div>

        </section>


        <!-- VISÃO DE MÊS -->

        <section class="grade-mes" *ngIf="visao === 'mes'">

            <div class="cabecalho-mes">
                <span *ngFor="let nome of ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']">{{ nome }}</span>
            </div>

            <div class="corpo-mes">

                <div
                    class="celula-mes"
                    *ngFor="let d of diasMini"
                    [class.fora]="d.getMonth() !== dataSelecionada.getMonth()"
                    (click)="novoEventoEm(d, 9)"
                >

                    <span class="numero-mes" [class.hoje]="ehHoje(d)">{{ d.getDate() }}</span>

                    <span class="feriado-mes" *ngIf="feriadoDoDia(d) as feriado">{{ feriado }}</span>

                    <button
                        type="button"
                        class="evento-mes"
                        *ngFor="let e of eventosDoDia(d)"
                        (click)="editarEvento(e, $event)"
                    >
                        {{ e.titulo }}
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- ===== MODAL: NOVO / EDITAR EVENTO ===== -->

    <div class="modal-fundo" *ngIf="modalAberto" (click)="fecharModal()">

        <div class="modal" (click)="$event.stopPropagation()">

            <header class="modal-topo">

                <h2>{{ rascunho.id === null ? 'Novo evento' : 'Editar evento' }}</h2>

                <button type="button" class="icone" (click)="fecharModal()" title="Fechar">
                    <i class="bi bi-x-lg"></i>
                </button>

            </header>

            <div class="modal-corpo">

                <div class="campo">
                    <label>Título</label>
                    <input type="text" [(ngModel)]="rascunho.titulo" placeholder="Adicionar título">
                </div>

                <div class="linha-campos">

                    <div class="campo">
                        <label>Data</label>
                        <input type="date" [(ngModel)]="rascunho.data">
                    </div>

                    <div class="campo">
                        <label>Início</label>
                        <input type="time" [(ngModel)]="rascunho.horaInicio">
                    </div>

                    <div class="campo">
                        <label>Término</label>
                        <input type="time" [(ngModel)]="rascunho.horaFim">
                    </div>

                </div>

                <div class="campo">
                    <label>Detalhes</label>
                    <textarea rows="4" [(ngModel)]="rascunho.detalhes" placeholder="Adicionar detalhes"></textarea>
                </div>

            </div>

            <footer class="modal-rodape">

                <button
                    type="button"
                    class="botao-excluir"
                    *ngIf="rascunho.id !== null"
                    (click)="excluirEvento()"
                >
                    Excluir
                </button>

                <span class="espaco"></span>

                <button type="button" class="botao-cancelar" (click)="fecharModal()">Cancelar</button>

                <button type="button" class="botao-salvar" (click)="salvarEvento()">
                    <i class="bi bi-save"></i>
                    Salvar
                </button>

            </footer>

        </div>

    </div>

</div>
